<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صندوق الوارد — PersistMail</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-bg"></div>
  <div class="shell">
    <header class="ibar">
      <div class="ibar-left">
        <a class="brand" href="/">
          <span class="mark" style="width:28px;height:28px;border-radius:8px;box-shadow:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M3 7.5 12 13l9-5.5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5Z" fill="#111"/>
            </svg>
          </span>
          <span class="brand-name">PersistMail</span>
        </a>
        <span class="ver" id="active-email">—</span>
        <button class="btn btn-ghost" id="copy-active" type="button" style="padding:7px 10px;font-size:12px" data-i18n="copy">نسخ</button>
      </div>
      <div class="ibar-right">
        <button class="btn btn-ghost" id="lang-toggle" type="button" style="padding:7px 12px;font-size:12px">English</button>
        <span class="quota" id="quota" data-i18n="unlimited">إرسال بلا حد</span>
        <button class="btn btn-lime" id="btn-compose" type="button" style="padding:7px 12px;font-size:12px" data-i18n="compose">رسالة جديدة</button>
        <button class="btn btn-ghost" id="btn-inject" type="button" style="padding:7px 10px;font-size:12px" data-i18n="receive">استلام تجريبي</button>
        <button class="btn btn-ghost" id="btn-new" type="button" style="padding:7px 12px;font-size:12px" data-i18n="newAddr">عنوان جديد</button>
      </div>
    </header>

    <main class="workspace">
      <section class="col">
        <div class="col-h"><h4 data-i18n="addresses">عناوين</h4></div>
        <div id="addr-list"></div>
      </section>
      <section class="col">
        <div class="col-h"><h4><span data-i18n="inbox">الوارد</span> · <span id="thread-count">0</span></h4></div>
        <div id="thread-list"></div>
      </section>
      <section class="col reader-col">
        <div class="reader" id="reader"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/inbox.js"></script>
</body>
</html>
